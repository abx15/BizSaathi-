name: WhatsApp Bot CI/CD

on:
  push:
    branches: [main]
    paths: ['backend/whatsapp-bot-service/**']
  pull_request:
    branches: [main]
    paths: ['backend/whatsapp-bot-service/**']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/whatsapp-bot

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/whatsapp-bot-service/package-lock.json

      - name: Install dependencies
        run: cd backend/whatsapp-bot-service && npm ci

      - name: Lint & Type check
        run: |
          cd backend/whatsapp-bot-service
          npm run lint || true
          npx tsc --noEmit || true

      - name: Run tests
        run: cd backend/whatsapp-bot-service && npm run test || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Downcase image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/whatsapp-bot-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-railway:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: whatsapp-bot
