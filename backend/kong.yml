_format_version: "3.0"

services:
  - name: backend-service
    url: http://backend:3001
    routes:
      - name: auth-route
        paths:
          - /v1/auth
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 60
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Accept-Version
                - Content-Length
                - Content-MD5
                - Content-Type
                - Date
                - Authorization
                - X-Tenant-ID
              exposed_headers:
                - X-Auth-Token
              credentials: true
              max_age: 3600
          - name: request-id
            config:
              header_name: X-Request-ID
      - name: customer-route
        paths:
          - /v1/customers
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: ["*"]
              methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
              headers: ["Accept", "Accept-Version", "Content-Length", "Content-MD5", "Content-Type", "Date", "Authorization", "X-Tenant-ID"]
              credentials: true
      - name: product-route
        paths:
          - /v1/products
