version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bizsaathi-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-bizsaathi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_prod_password}
      POSTGRES_DB: ${DB_NAME:-bizsaathi_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: bizsaathi-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secure_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/bizsaathi/backend:latest
    container_name: bizsaathi-backend-prod
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-bizsaathi_user}:${DB_PASSWORD:-secure_prod_password}@postgres:5432/${DB_NAME:-bizsaathi_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-ensure_change_in_production_jwt_secret}
      SENTRY_DSN: ${SENTRY_DSN}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    image: ghcr.io/bizsaathi/worker-service:latest
    container_name: bizsaathi-worker-prod
    build:
      context: ../worker-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-bizsaathi_user}:${DB_PASSWORD:-secure_prod_password}@postgres:5432/${DB_NAME:-bizsaathi_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379
      SENTRY_DSN: ${SENTRY_DSN}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local
