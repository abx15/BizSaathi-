version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bizsaathi-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bizsaathi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bizsaathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bizsaathi-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kong:
    image: kong:3.4
    container_name: bizsaathi-kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    ports:
      - '8000:8000'
      - '8011:8001'
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizsaathi-backend
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      - API_PREFIX=v1
      # Note: using postgres and redis service names here for internal routing
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bizsaathi?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=change_me_access_secret_min_32_chars
      - JWT_REFRESH_SECRET=change_me_refresh_secret_min_32_chars
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - OTP_EXPIRY_SECONDS=600
      - OTP_MAX_ATTEMPTS=5
      - CORS_ORIGINS=http://localhost:3000
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=60
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  crm-service:
    build:
      context: ./crm-service
      dockerfile: Dockerfile
    container_name: bizsaathi-crm-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bizsaathi?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=349fd7e78c263e71f264a348687a07e89aff93a8aa599b67110fc0fc62cc48dc
      - LOG_LEVEL=info
      - RATE_LIMIT_RPM=120
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: bizsaathi-ai-service
    ports:
      - "8008:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bizsaathi?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=349fd7e78c263e71f264a348687a07e89aff93a8aa599b67110fc0fc62cc48dc
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_BUSINESS=business_data
      - QDRANT_COLLECTION_INSIGHTS=insights_cache
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-super_secret_internal_key}
      - LOG_LEVEL=info
      - MAX_CONTEXT_TOKENS=4000
      - LLM_MODEL=llama-3.3-70b-versatile
      - LLM_MAX_TOKENS=1000
      - LLM_TEMPERATURE=0.3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: bizsaathi-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  whatsapp-bot-service:
    build:
      context: ./whatsapp-bot-service
      dockerfile: Dockerfile
    container_name: bizsaathi-whatsapp-bot-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bizsaathi?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=349fd7e78c263e71f264a348687a07e89aff93a8aa599b67110fc0fc62cc48dc
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - NESTJS_INTERNAL_URL=http://backend:3001
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime-service:
    build:
      context: ./realtime-service
      dockerfile: Dockerfile
    container_name: bizsaathi-realtime-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=349fd7e78c263e71f264a348687a07e89aff93a8aa599b67110fc0fc62cc48dc
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-super_secret_internal_key}
      - CORS_ORIGINS=http://localhost:3000,https://bizsaathi.in
      - MAX_CONNECTIONS=10000
      - PING_INTERVAL_SECONDS=30
      - PONG_TIMEOUT_SECONDS=10
      - LOG_LEVEL=info
      - GO_ENV=development
    depends_on:
      redis:
        condition: service_healthy

  worker-service:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    container_name: bizsaathi-worker-service
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://neondb_owner:npg_R8AjElBf7LeT@ep-royal-grass-ap7cnn88-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require

# Redis
# REDIS_URL=redis://localhost:6379
      - REDIS_URL=redis://localhost:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-super_secret_internal_key}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM=${RESEND_FROM}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

