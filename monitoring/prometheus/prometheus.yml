global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  - job_name: 'nestjs-backend'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/api/v1/metrics'

  - job_name: 'crm-service'
    static_configs:
      - targets: ['crm-service:3005']
    metrics_path: '/metrics'

  - job_name: 'realtime-service'
    static_configs:
      - targets: ['realtime-service:3006']
    metrics_path: '/metrics'

  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:8000']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
