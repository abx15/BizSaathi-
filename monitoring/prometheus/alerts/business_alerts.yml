groups:
  - name: business_alerts
    rules:
      - alert: NoInvoicesCreated
        expr: increase(invoices_created_total[1h]) == 0
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "No invoices created in 2 hours — check if service is healthy"
          description: "Invoices created is 0 for past 2 hours. Please check if customers are blocked or billing services are failing."

      - alert: WhatsAppDeliveryFailure
        expr: |
          rate(whatsapp_sent_total[5m]) > 0 AND
          rate(whatsapp_delivered_total[5m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "WhatsApp messages being sent but none delivered"
          description: "Check Meta API token and phone number status in Meta Suite. High likelihood of webhook auth failure or rate block."

      - alert: AIServiceSlowQueries
        expr: |
          histogram_quantile(0.95,
            rate(ai_query_duration_seconds_bucket[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI queries taking > 10s P95"
          description: "AI query response latency is extremely high. Check Qdrant collections or Groq limits."
