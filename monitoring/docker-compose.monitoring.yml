version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: bizsaathi-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '9090:9090'
    networks:
      - bizsaathi
    restart: always

  grafana:
    image: grafana/grafana:10.0.3
    container_name: bizsaathi-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=change_me_grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - '3000:3000'
    networks:
      - bizsaathi
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: bizsaathi-node-exporter
    ports:
      - '9100:9100'
    networks:
      - bizsaathi
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    container_name: bizsaathi-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - '9121:9121'
    networks:
      - bizsaathi
    restart: always
    depends_on:
      - redis

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.12.1
    container_name: bizsaathi-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/bizsaathi?sslmode=disable
    ports:
      - '9187:9187'
    networks:
      - bizsaathi
    restart: always
    depends_on:
      - postgres

networks:
  bizsaathi:
    external: true
    name: bizsaathi_default

volumes:
  prometheus_data:
  grafana_data:
